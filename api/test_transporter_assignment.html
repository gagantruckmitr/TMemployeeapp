<!DOCTYPE html>
<html>
<head>
    <title>Test Transporter Assignment</title>
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .section { background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 5px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
        pre { background: #333; color: #fff; padding: 15px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #4CAF50; color: white; }
    </style>
</head>
<body>
    <h1>🚛 Transporter Assignment Tester</h1>
    
    <div class="section">
        <h3>1. Check Assignment Distribution</h3>
        <button onclick="checkAssignment()">Check Round-Robin Assignment</button>
        <div id="assignmentResult"></div>
    </div>
    
    <div class="section">
        <h3>2. Test API for Each Telecaller</h3>
        <button onclick="testAllTelecallers()">Test All Telecallers</button>
        <div id="telecallerResults"></div>
    </div>
    
    <script>
        async function checkAssignment() {
            try {
                const res = await fetch('debug_transporter_assignment.php');
                const data = await res.json();
                
                let html = '<div class="success">✅ Assignment Check Complete</div>';
                html += '<p><strong>Total Telecallers:</strong> ' + data.telecallers + '</p>';
                html += '<p><strong>Available Transporters:</strong> ' + data.available_transporters + '</p>';
                
                if (data.assignments) {
                    html += '<h4>Distribution:</h4><table>';
                    html += '<tr><th>Telecaller ID</th><th>Telecaller Name</th><th>Assigned Count</th></tr>';
                    for (let tcId in data.assignments) {
                        const tc = data.assignments[tcId];
                        html += '<tr><td>' + tcId + '</td><td>' + tc.name + '</td><td>' + tc.transporters.length + '</td></tr>';
                    }
                    html += '</table>';
                }
                
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                document.getElementById('assignmentResult').innerHTML = html;
            } catch (e) {
                document.getElementById('assignmentResult').innerHTML = '<div class="error">❌ Error: ' + e.message + '</div>';
            }
        }
        
        async function testAllTelecallers() {
            try {
                const assignRes = await fetch('debug_transporter_assignment.php');
                const assignData = await assignRes.json();
                
                let html = '<h4>Testing API for each telecaller:</h4>';
                
                for (let tcId in assignData.assignments) {
                    const tc = assignData.assignments[tcId];
                    const apiRes = await fetch('transporter_leads_api.php?action=transporter_leads&caller_id=' + tcId + '&limit=50');
                    const apiData = await apiRes.json();
                    
                    html += '<div style="margin: 10px 0; padding: 10px; background: white; border-left: 3px solid #4CAF50;">';
                    html += '<strong>Telecaller ' + tcId + ' (' + tc.name + '):</strong> ';
                    html += apiData.success ? '<span class="success">✅ ' + apiData.count + ' transporters</span>' : '<span class="error">❌ Failed</span>';
                    html += '</div>';
                }
                
                document.getElementById('telecallerResults').innerHTML = html;
            } catch (e) {
                document.getElementById('telecallerResults').innerHTML = '<div class="error">❌ Error: ' + e.message + '</div>';
            }
        }
    </script>
</body>
</html>
