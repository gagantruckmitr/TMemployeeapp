<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyGo IVR Interactive Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .content {
            padding: 40px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.success {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }
        .result.error {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }
        .result.loading {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            color: #1565c0;
        }
        .result h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }
        .result p {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .result pre {
            background: rgba(0,0,0,0.05);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            margin-top: 15px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .info-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .info-box h4 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info-box ul {
            margin-left: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📞 EasyGo IVR Test</h1>
            <p>Test calling between two phone numbers</p>
        </div>
        
        <div class="content">
            <div class="info-box">
                <h4>ℹ️ How it works:</h4>
                <ul>
                    <li>Enter your telecaller phone number (your phone)</li>
                    <li>Enter the client phone number (person to call)</li>
                    <li>Click "Initiate Call"</li>
                    <li>Both phones will ring simultaneously</li>
                    <li>When either party answers, you'll be connected</li>
                </ul>
            </div>

            <form id="callForm">
                <div class="form-group">
                    <label for="telecallerPhone">
                        📱 Telecaller Phone Number
                        <span style="color: #999; font-weight: normal;">(Your phone)</span>
                    </label>
                    <input 
                        type="tel" 
                        id="telecallerPhone" 
                        name="telecallerPhone" 
                        placeholder="e.g., 08303154516 or 8303154516"
                        value="08303154516"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="clientPhone">
                        👤 Client Phone Number
                        <span style="color: #999; font-weight: normal;">(Person to call)</span>
                    </label>
                    <input 
                        type="tel" 
                        id="clientPhone" 
                        name="clientPhone" 
                        placeholder="e.g., 06265760864 or 6265760864"
                        value="06265760864"
                        required
                    >
                </div>

                <button type="submit" class="btn" id="callBtn">
                    📞 Initiate Call
                </button>
            </form>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('callForm');
        const resultDiv = document.getElementById('result');
        const callBtn = document.getElementById('callBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const telecallerPhone = document.getElementById('telecallerPhone').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();

            // Validate
            if (!telecallerPhone || !clientPhone) {
                showResult('error', 'Please enter both phone numbers');
                return;
            }

            // Show loading
            callBtn.disabled = true;
            callBtn.innerHTML = '<span class="spinner"></span> Initiating Call...';
            showResult('loading', 'Connecting to EasyGo IVR API...', 'Please wait...');

            try {
                const response = await fetch('easygo_ivr_api.php?action=initiate_call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        exten: telecallerPhone,
                        number: clientPhone,
                        caller_id: 1,
                        contact_id: 'TEST_' + Date.now(),
                        contact_type: 'driver',
                        duration: ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult('success', 
                        '✅ Call Initiated Successfully!',
                        `
                        <p><strong>Reference ID:</strong> ${data.reference_id || 'N/A'}</p>
                        <p><strong>Call Log ID:</strong> ${data.call_log_id || 'N/A'}</p>
                        <p><strong>Status:</strong> Both phones should ring now!</p>
                        <p style="margin-top: 15px; padding-top: 15px; border-top: 2px solid #4caf50;">
                            <strong>📞 What's happening:</strong><br>
                            • Telecaller phone (${telecallerPhone}) is ringing<br>
                            • Client phone (${clientPhone}) is ringing<br>
                            • Answer either phone to connect the call
                        </p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        `
                    );
                } else {
                    showResult('error', 
                        '❌ Call Failed',
                        `
                        <p><strong>Error:</strong> ${data.error || 'Unknown error'}</p>
                        <p>Please check:</p>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            <li>Phone numbers are correct (10 digits minimum)</li>
                            <li>API credentials are configured</li>
                            <li>Token is not expired</li>
                            <li>Network connection is stable</li>
                        </ul>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        `
                    );
                }
            } catch (error) {
                showResult('error', 
                    '❌ Connection Error',
                    `
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Could not connect to the API. Please check your network connection.</p>
                    `
                );
            } finally {
                callBtn.disabled = false;
                callBtn.innerHTML = '📞 Initiate Call';
            }
        });

        function showResult(type, title, content) {
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                ${content}
            `;
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
